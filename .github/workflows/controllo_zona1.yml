name: Controllo Zona 1

on:
  workflow_dispatch:

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Controlla il sito regionale
        run: python monitor_zona1.py

      - name: Mostra testo della pagina
        run: |
          echo "=== INIZIO TESTO PAGINA ==="
          head -c 20000 pagina_centro_funzionale.txt
          echo
          echo "=== FINE TESTO PAGINA ==="

      - name: Salva risultati
        uses: actions/upload-artifact@v4
        with:
          name: risultati-zona1
          path: |
            pagina_centro_funzionale.txt
            pagina_centro_funzionale.html
            pagina_centro_funzionale.png
