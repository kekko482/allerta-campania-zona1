name: Controllo Zona 1

on:
  workflow_dispatch:

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla il sito regionale
        run: python monitor_zona1.py

      - name: Cerca informazioni Zona 1
        run: |
          echo "=== RICERCA ZONA 1 ==="
          grep -oiE '.{0,150}(zona 1|zona1|allerta|verde|gialla|arancione|rossa).{0,250}' pagina_centro_funzionale.html | head -30

      - name: Salva pagina come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: pagina-centro-funzionale
          path: pagina_centro_funzionale.html
