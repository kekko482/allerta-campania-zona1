name: Controllo Zona 1

on:
  workflow_dispatch:

jobs:
  controllo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla il sito regionale
        run: python monitor_zona1.py

      - name: Mostra contenuto pagina
        run: |
          echo "=== INIZIO PAGINA ==="
          head -c 10000 pagina_centro_funzionale.html
          echo
          echo "=== FINE PAGINA ==="

      - name: Salva pagina come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: pagina-centro-funzionale
          path: pagina_centro_funzionale.html
